<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lienzo HTML — edita código HTML con una barra de herramientas y previsualízalo en tiempo real en PC, tablet y celular, respetando tu diseño original." />
  <title>Lienzo HTML</title>

  <!-- Seguridad: ver README.md ("Notas de seguridad") para la explicación
       completa. En resumen: no usamos una política CSP aquí porque
       cualquier política en este documento se filtra también al iframe
       de previsualización (vía srcdoc) y bloquearía los estilos e
       inline-scripts del HTML que el usuario pega — que es la razón de
       ser de esta herramienta. El aislamiento real de seguridad lo da
       el atributo sandbox="allow-scripts" del iframe (sin
       "allow-same-origin"), no una CSP. -->
  <meta http-equiv="Permissions-Policy"
    content="geolocation=(), microphone=(), camera=(), payment=(), usb=()" />

  <!-- Favicon / marcadores -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="shortcut icon" href="icons/favicon-32.png" />

  <!-- Instalación como app (PWA) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6366f1" />

  <!-- App Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div id="app">

    <!-- ===== HEADER ===== -->
    <header>
      <div class="header-brand">
        <div class="logo-icon" aria-hidden="true">⟨⟩</div>
        <h1>Lienzo <span>HTML</span></h1>
      </div>

      <div class="header-actions">
        <div class="device-toggle" role="group" aria-label="Cambiar vista de dispositivo">
          <button id="btn-pc" class="active" aria-pressed="true">💻 PC</button>
          <button id="btn-mobile" aria-pressed="false">📱 Móvil</button>
        </div>

        <button type="button" id="btn-theme-toggle" class="theme-toggle-btn" title="Cambiar entre tema claro y oscuro (la previsualización siempre queda en blanco)">
          <span id="theme-toggle-icon">🌙</span>
        </button>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main>

      <!-- LEFT PANEL: Editor -->
      <section class="panel-editor" id="panel-editor" aria-label="Panel de edición de código HTML">

        <!-- Toolbar -->
        <div class="editor-toolbar" role="toolbar" aria-label="Herramientas de formato HTML">

          <div class="toolbar-group">
            <select id="sel-heading" class="tb-select" title="Aplicar formato de bloque a la selección o línea actual">
              <option value="" selected disabled>Formato ▾</option>
              <option value="p">Párrafo</option>
              <option value="h1">Título 1</option>
              <option value="h2">Título 2</option>
              <option value="h3">Título 3</option>
              <option value="h4">Título 4</option>
            </select>
          </div>

          <div class="toolbar-group">
            <button type="button" class="tb-btn" id="btn-bold" title="Negrita (Ctrl+B)"><strong>B</strong></button>
            <button type="button" class="tb-btn" id="btn-italic" title="Cursiva (Ctrl+I)"><em>I</em></button>
            <button type="button" class="tb-btn" id="btn-underline" title="Subrayado (Ctrl+U)"><u>U</u></button>
            <button type="button" class="tb-btn" id="btn-strike" title="Tachado"><s>S</s></button>
          </div>

          <div class="toolbar-group">
            <div class="tb-color-btn-wrap">
              <button type="button" class="tb-btn" id="btn-text-color" title="Color de texto">🎨 Texto</button>
              <div class="color-popover" id="popover-text-color" hidden>
                <div class="color-popover-row">
                  <input type="color" id="picker-text-color" value="#1e293b" aria-label="Selector de color de texto" />
                  <input type="text" id="hex-text-color" class="hex-input" value="#1e293b" maxlength="7" aria-label="Código hexadecimal" />
                </div>
                <div class="color-swatches" id="swatches-text-color"></div>
                <div class="color-popover-actions">
                  <button type="button" class="tb-btn tb-btn-small" id="btn-remove-text-color">Quitar color</button>
                  <button type="button" class="tb-btn tb-btn-primary tb-btn-small" id="btn-apply-text-color">Aplicar</button>
                </div>
              </div>
            </div>

            <div class="tb-color-btn-wrap">
              <button type="button" class="tb-btn" id="btn-bg-color" title="Color de resaltado / fondo">🖍️ Fondo</button>
              <div class="color-popover" id="popover-bg-color" hidden>
                <div class="color-popover-row">
                  <input type="color" id="picker-bg-color" value="#fde047" aria-label="Selector de color de fondo" />
                  <input type="text" id="hex-bg-color" class="hex-input" value="#fde047" maxlength="7" aria-label="Código hexadecimal" />
                </div>
                <div class="color-swatches" id="swatches-bg-color"></div>
                <div class="color-popover-actions">
                  <button type="button" class="tb-btn tb-btn-small" id="btn-remove-bg-color">Quitar color</button>
                  <button type="button" class="tb-btn tb-btn-primary tb-btn-small" id="btn-apply-bg-color">Aplicar</button>
                </div>
              </div>
            </div>
          </div>

          <div class="toolbar-group">
            <button type="button" class="tb-btn" id="btn-ul" title="Lista con viñetas">• Lista</button>
            <button type="button" class="tb-btn" id="btn-ol" title="Lista numerada">1. Lista</button>
          </div>

          <div class="toolbar-group">
            <button type="button" class="tb-btn" id="btn-link" title="Insertar enlace">🔗 Enlace</button>
            <button type="button" class="tb-btn" id="btn-table" title="Insertar tabla (elige filas y columnas)">📊 Tabla</button>
            <button type="button" class="tb-btn" id="btn-table-row" title="Añadir una fila a la tabla más cercana al cursor">➕ Fila</button>
          </div>

          <div class="toolbar-group">
            <button type="button" class="tb-btn" id="btn-clean" title="Quita el formato (negrita, cursiva, color, enlace, etc.) del texto seleccionado, incluida la etiqueta que lo envuelve">🧹 Formato</button>
            <button type="button" class="tb-btn" id="btn-beautify" title="Reorganiza la indentación del código para que se lea ordenado. No cambia el diseño, solo el orden visual del código">🧩 Indentar</button>
          </div>

          <div class="toolbar-group tb-group-end">
            <button type="button" class="tb-btn tb-btn-copy" id="btn-copy" title="Copiar todo el HTML al portapapeles">📋 Copiar</button>
            <button type="button" class="tb-btn tb-btn-danger" id="btn-clear-all" title="Borrar todo el contenido">🗑️ Limpiar todo</button>
          </div>
        </div>

        <!-- Code HTML Editor (única fuente de verdad) -->
        <!-- El <pre><code> de abajo es decorativo (aria-hidden): muestra el
             mismo texto coloreado por tipo de token (etiqueta, atributo,
             valor, comentario). El textarea sigue siendo el real: se edita,
             selecciona y copia normalmente; solo su texto se vuelve
             transparente para que se vea el resaltado de atrás. -->
        <div class="code-editor-wrapper">
          <pre class="code-highlight" id="code-highlight" aria-hidden="true"><code id="code-highlight-content"></code></pre>
          <textarea
            id="code-editor"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            placeholder="Escribe o pega tu código HTML aquí. Se previsualizará tal cual, respetando tu diseño…"
          ></textarea>
        </div>
      </section>

      <!-- RESIZER -->
      <div class="panel-resizer" id="panel-resizer" role="separator" aria-orientation="vertical" aria-label="Redimensionar editor y previsualización" tabindex="0"></div>

      <!-- RIGHT PANEL: Preview -->
      <section class="panel-preview" aria-label="Panel de previsualización">
        <div class="panel-preview-header">
          <span>Previsualización</span>
          <div class="preview-header-right">
            <select id="sel-device-preset" class="tb-select device-preset-select" title="Elegir resolución" hidden>
              <optgroup label="Teléfonos">
                <option value="320x568">iPhone SE (1.ª gen) — 320×568</option>
                <option value="375x667" selected>iPhone SE / 6 / 7 / 8 — 375×667</option>
                <option value="390x844">iPhone 12 / 13 / 14 — 390×844</option>
                <option value="393x852">iPhone 15 / 16 Pro — 393×852</option>
                <option value="428x926">iPhone 12 / 13 Pro Max — 428×926</option>
                <option value="430x932">iPhone 15 / 16 Pro Max — 430×932</option>
                <option value="360x800">Samsung Galaxy S20 / S21 — 360×800</option>
                <option value="384x854">Samsung Galaxy S22 Ultra — 384×854</option>
                <option value="393x873">Samsung Galaxy S23 — 393×873</option>
                <option value="393x851">Google Pixel 5 / 6 — 393×851</option>
                <option value="412x915">Google Pixel 7 / 8 — 412×915</option>
                <option value="360x640">Android genérico pequeño — 360×640</option>
                <option value="412x892">Android genérico grande — 412×892</option>
              </optgroup>
              <optgroup label="Tablets">
                <option value="768x1024">iPad Mini / Air (vertical) — 768×1024</option>
                <option value="834x1194">iPad Pro 11" (vertical) — 834×1194</option>
                <option value="800x1280">Tablet Android (vertical) — 800×1280</option>
                <option value="1024x768">iPad (horizontal) — 1024×768</option>
              </optgroup>
            </select>
            <span class="device-label" id="device-label">💻 PC — 100%</span>
          </div>
        </div>

        <!-- Controles de zoom: solo relevantes en vista Móvil/Tablet -->
        <div class="preview-zoom-bar" id="zoom-bar" hidden>
          <button type="button" class="tb-btn tb-btn-small" id="btn-zoom-out" title="Alejar">−</button>
          <input type="range" id="zoom-slider" class="zoom-slider" min="25" max="150" step="5" value="100" title="Zoom" aria-label="Nivel de zoom" />
          <button type="button" class="tb-btn tb-btn-small" id="btn-zoom-in" title="Acercar">+</button>
          <span class="zoom-value" id="zoom-value">100%</span>
          <button type="button" class="tb-btn tb-btn-small" id="btn-zoom-fit" title="Ajustar automáticamente para que el dispositivo completo entre en la ventana">🔳 Auto-ajustar</button>
        </div>

        <div class="preview-canvas" id="preview-canvas">
          <div class="device-scale-wrapper" id="device-scale-wrapper">
            <div class="device-container mode-pc" id="device-container">
              <iframe
                id="preview-frame"
                title="Previsualización del contenido HTML"
                sandbox="allow-scripts"
                referrerpolicy="no-referrer"
              ></iframe>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- ===== MODAL: Insertar tabla ===== -->
  <div class="modal-overlay" id="modal-table" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-table-title">
      <h2 id="modal-table-title">Insertar tabla</h2>

      <div class="modal-field">
        <label for="input-rows">Filas de datos</label>
        <input type="number" id="input-rows" min="1" max="50" value="3" />
      </div>
      <div class="modal-field">
        <label for="input-cols">Columnas</label>
        <input type="number" id="input-cols" min="1" max="20" value="3" />
      </div>
      <div class="modal-field modal-field-checkbox">
        <label><input type="checkbox" id="input-header" checked /> Incluir fila de encabezado</label>
      </div>

      <div class="modal-actions">
        <button type="button" class="tb-btn" id="btn-table-cancel">Cancelar</button>
        <button type="button" class="tb-btn tb-btn-primary" id="btn-table-insert">Insertar tabla</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL: Insertar enlace ===== -->
  <div class="modal-overlay" id="modal-link" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-link-title">
      <h2 id="modal-link-title">Insertar enlace</h2>

      <div class="modal-field">
        <label for="input-link-url">URL</label>
        <input type="url" id="input-link-url" placeholder="https://ejemplo.com" />
      </div>
      <div class="modal-field">
        <label for="input-link-text">Texto del enlace (si no hay selección)</label>
        <input type="text" id="input-link-text" placeholder="Texto visible" />
      </div>

      <div class="modal-actions">
        <button type="button" class="tb-btn" id="btn-link-cancel">Cancelar</button>
        <button type="button" class="tb-btn tb-btn-primary" id="btn-link-insert">Insertar enlace</button>
      </div>
    </div>
  </div>

  <!-- App Logic -->
  <script src="js/app.js"></script>
</body>
</html>
